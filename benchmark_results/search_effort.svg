 calls</text><rect x="133.97" y="140.43" width="64.80" height="269.57" fill="#1f6feb" rx="2"/><text x="166.37" y="135.4" text-anchor="middle" font-size="9" fill="#222222">69,264</text><rect x="200.77" y="369.97" width="64.80" height="40.03" fill="#d9730d" rx="2"/><text x="233.17" y="365.0" text-anchor="middle" font-size="9" fill="#222222">10,285</text><rect x="267.57" y="373.60" width="64.80" height="36.40" fill="#2da44e" rx="2"/><text x="299.97" y="368.6" text-anchor="middle" font-size="9" fill="#222222">9,354</text><text x="512.5" y="432.0" font-size="11" fill="#333333" text-anchor="end" transform="rotate(-30 512.5 432.0)">Attempted assignments</text><rect x="412.30" y="140.45" width="64.80" height="269.55" fill="#1f6feb" rx="2"/><text x="444.70" y="135.5" text-anchor="middle" font-size="9" fill="#222222">69,260</text><rect x="479.10" y="369.99" width="64.80" height="40.01" fill="#d9730d" rx="2"/><text x="511.50" y="365.0" text-anchor="middle" font-size="9" fill="#222222">10,281</text><rect x="545.90" y="369.99" width="64.80" height="40.01" fill="#2da44e" rx="2"/><text x="578.30" y="365.0" text-anchor="middle" font-size="9" fill="#222222">10,281</text><text x="790.8" y="432.0" font-size="11" fill="#333333" text-anchor="end" transform="rotate(-30 790.8 432.0)">Backtracks</text><rect x="690.63" y="141.10" width="64.80" height="268.90" fill="#1f6feb" rx="2"/><text x="723.03" y="136.1" text-anchor="middle" font-size="9" fill="#222222">69,092</text><rect x="757.43" y="370.64" width="64.80" height="39.36" fill="#d9730d" rx="2"/><text x="789.83" y="365.6" text-anchor="middle" font-size="9" fill="#222222">10,113</text><rect x="824.23" y="370.64" width="64.80" height="39.36" fill="#2da44e" rx="2"/><text x="856.63" y="365.6" text-anchor="middle" font-size="9" fill="#222222">10,113</text><rect x="95" y="68" width="13" height="13" fill="#1f6feb" rx="2"/><text x="114" y="78" font-size="12" fill="#222222">backtracking</text><rect x="205" y="68" width="13" height="13" fill="#d9730d" rx="2"/><text x="224" y="78" font-size="12" fill="#222222">mrv</text><rect x="252" y="68" width="13" height="13" fill="#2da44e" rx="2"/><text x="271" y="78" font-size="12" fill="#222222">mrv_forward_checking</text><text x="95" y="532" font-size="10.5" fill="#444444">Values: sum of each search counter across the 4 puzzle(s) solved by all selected algorithms. Counters are deterministic, so they are reproducible (unlike timings).</text><text x="95" y="548" font-size="10.5" fill="#444444">recursive_calls = entries to the recursive search (incl. the initial call); attempted_assignments = candidate values written for testing; backtracks = assignments undone.</text><text x="95" y="564" font-size="10.5" fill="#444444">Included: already_completed, easy_classic, hard_inkala, medium_classic</text><text x="95" y="580" font-size="10.5" fill="#444444">Excluded from this chart (invalid / unsolvable / not solved by all): invalid_duplicate_clues, unsolvable_no_duplicates</text></svg>